spring.application.name=queue-management
server.port=${PORT:8080}

# Database Configuration (Defaults to local MySQL, overridable by Render/Cloud environment variables)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/queue_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root1234}

# JPA / Hibernate Properties (Dialect is auto-detected for MySQL or PostgreSQL)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
